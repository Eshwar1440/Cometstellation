name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege for every job unless a job asks for more
permissions:
  contents: read

# A new push to the same branch cancels the run it replaces
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python: ${{ steps.filter.outputs.python }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v5
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            python:
              - 'ingest/**'
              - 'services/**'
              - 'tests/**'
              - 'schema.cypher'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - '.github/workflows/ci.yml'

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0          # gitleaks needs history to scan every commit in the PR
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/ci-password-123      # throwaway, CI only, 8+ chars required by Neo4j 5
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-password-123 'RETURN 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ci-password-123
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.0.1    
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --frozen               # fails if uv.lock is missing or out of date
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json   # reads the pnpm version from "packageManager"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      # No `next build` here. Vercel builds every PR as a preview deploy, so CI would duplicate it
      # and would also need Clerk keys at build time.

  ci-ok:
    if: always()
    needs: [changes, secrets, python, web]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any needed job failed or was cancelled
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "A required job failed"
            exit 1
          fi
