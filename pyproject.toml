[project]
name = "constellation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "neo4j>=5",
  "pydantic>=2",
  "httpx",
]

[dependency-groups]
dev = [
  "pytest",
  "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]   # S is bandit, catches hardcoded secrets and unsafe calls
ignore = ["S101"]                          # allow assert in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]              # test passwords like the CI Neo4j one are fine

[tool.pytest.ini_options]
testpaths = ["tests"]
